name: Task
description: Refactoring, documentation, build or CI work, tests, or other maintenance.
labels: ["status: needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that define when this is done.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
