[package]
name = "delve-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
inventory.workspace = true
futures.workspace = true

[dev-dependencies]
# test-util enables tokio::time::{pause, advance} and the
# #[tokio::test(start_paused = true)] attribute, used by context.rs's
# RateLimiter tests to test real timing behavior without actually sleeping
# in wall-clock time. Dev-only: production builds don't get this feature.
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber.workspace = true
